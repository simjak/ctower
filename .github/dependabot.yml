version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    # The canonical lock (requirements/verify.txt) is owned by the repo's own
    # uv flow (docs/contributing/development.md). Exclude it from Dependabot so
    # it bumps requirements/verify.in only and never recompiles the lock with
    # its own resolver (which drops direct pins, e.g. setuptools). gh#251.
    exclude-paths:
      - verify.txt
