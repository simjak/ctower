name: Bug report
description: Report a reproducible problem in behavior that currently exists.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ctower is pre-alpha. Check the project status before reporting runtime behavior. Do not include secrets, personal data, customer data, or vulnerability details.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide the full commit SHA or SemVer release.
      placeholder: abcdef123456...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include exact commands or steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add redacted logs, traces, screenshots, or failing test output.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report contains no secrets, personal data, customer data, or private infrastructure details.
          required: true
        - label: This is not a security vulnerability; I will use private vulnerability reporting for security issues.
          required: true
