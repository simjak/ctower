name: Documentation issue
description: Report unclear, missing, stale, or incorrect documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link to the page or provide its repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, stale, or contradicted by source truth?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: If known, point to the canonical contract, test, decision, or specification section.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing documentation issue.
          required: true
        - label: This report contains no secrets, personal data, or private infrastructure details.
          required: true
