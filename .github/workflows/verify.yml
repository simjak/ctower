name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Verification-host choices only. They do not select ctower's unresolved product runtime.
env:
  CTOWER_VERIFY_PYTHON: "3.13.14"
  CTOWER_VERIFY_NODE: "24.16.0"
  CTOWER_VERIFY_NODE_SHA256: d804845d34eddc21dc1092b519d643ef40b1f58ec5dec5c22b1f4bd8fabde6c9
  CTOWER_VERIFY_PNPM: "10.20.0"
  CTOWER_VERIFY_PNPM_SHA256: d25defac8655080add042decfa94b5c3b28cafbb048edd4de6dc2c41f9220418
  CTOWER_VERIFY_JUST: "1.46.0"
  CTOWER_VERIFY_JUST_SHA256: 79966e6e353f535ee7d1c6221641bcc8e3381c55b0d0a6dc6e54b34f9db36eaa
  CTOWER_VERIFY_ACTIONLINT: "1.7.11"
  CTOWER_VERIFY_ACTIONLINT_SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
  CTOWER_VERIFY_GITLEAKS: "8.28.0"
  CTOWER_VERIFY_GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  release-gate:
    name: release gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Establish complete repository graph
        shell: bash
        run: |
          set -euo pipefail
          shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository=%s\n' "${shallow_state}"
          shallow_path="$(git rev-parse --git-path shallow)"
          if [[ "${shallow_state}" == "true" ]]; then
            printf '.git/shallow stat:\n'
            stat "${shallow_path}"
            printf '.git/shallow contents:\n'
            cat "${shallow_path}"
            printf 'origin/main=%s\n' "$(git rev-parse --verify 'origin/main^{commit}')"
            git fetch --unshallow origin
          fi
          final_shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository-after=%s\n' "${final_shallow_state}"
          if [[ "${final_shallow_state}" != "false" ]]; then
            printf 'repository graph must be complete\n' >&2
            exit 1
          fi

      - name: Install verification-host Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.CTOWER_VERIFY_PYTHON }}
          cache: pip
          cache-dependency-path: requirements/verify.txt

      - name: Install hash-locked Python verification dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements/verify.txt

      - name: Install Linux Secret Service test runtime
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=2
          per_attempt_seconds=300
          operation_timeout_seconds=660
          max_backoff_seconds=30
          operation_deadline=$((SECONDS + operation_timeout_seconds))
          last_exit_code=1
          last_failure_reason="not-started"

          run_setup_attempt() {
            local attempt="$1"
            local remaining_seconds=$((operation_deadline - SECONDS))
            local attempt_timeout_seconds="$per_attempt_seconds"

            if (( remaining_seconds < attempt_timeout_seconds )); then
              attempt_timeout_seconds="$remaining_seconds"
            fi
            if (( attempt_timeout_seconds <= 0 )); then
              last_exit_code=124
              last_failure_reason="operation-deadline-exhausted"
              return 124
            fi

            printf 'secret-service setup attempt=%d/%d timeout_seconds=%d\n' \
              "$attempt" "$max_attempts" "$attempt_timeout_seconds"
            if timeout --signal=TERM --kill-after=5s "${attempt_timeout_seconds}s" \
              bash -c 'sudo apt-get update && sudo apt-get install --yes --no-install-recommends gnome-keyring'
            then
              return 0
            else
              last_exit_code=$?
            fi

            if (( last_exit_code == 124 )); then
              last_failure_reason="runner-timeout"
              printf 'secret-service setup attempt=%d classification=retryable reason=%s exit_code=%d\n' \
                "$attempt" "$last_failure_reason" "$last_exit_code" >&2
            else
              last_failure_reason="package-or-dependency-error"
              printf 'secret-service setup attempt=%d classification=terminal reason=%s exit_code=%d\n' \
                "$attempt" "$last_failure_reason" "$last_exit_code" >&2
            fi
            return "$last_exit_code"
          }

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if run_setup_attempt "$attempt"; then
              exit 0
            else
              attempt_exit_code=$?
            fi

            if [[ "$last_failure_reason" != "runner-timeout" ]]; then
              printf 'secret-service setup stopped: classification=terminal reason=%s attempt_count=%d exit_code=%d\n' \
                "$last_failure_reason" "$attempt" "$attempt_exit_code" >&2
              exit "$attempt_exit_code"
            fi

            if (( attempt >= max_attempts )); then
              printf 'secret-service setup exhausted: reason=%s attempt_count=%d max_attempts=%d exit_code=%d\n' \
                "$last_failure_reason" "$attempt" "$max_attempts" "$attempt_exit_code" >&2
              exit "$attempt_exit_code"
            fi

            remaining_seconds=$((operation_deadline - SECONDS))
            if (( remaining_seconds <= 0 )); then
              printf 'secret-service setup exhausted: reason=operation-deadline-exhausted attempt_count=%d max_attempts=%d exit_code=124\n' \
                "$attempt" "$max_attempts" >&2
              exit 124
            fi

            backoff_base_seconds=$((5 * (2 ** (attempt - 1))))
            jitter_seconds=$((RANDOM % (backoff_base_seconds + 1)))
            backoff_seconds=$((backoff_base_seconds + jitter_seconds))
            if (( backoff_seconds > max_backoff_seconds )); then
              backoff_seconds="$max_backoff_seconds"
            fi
            if (( backoff_seconds >= remaining_seconds )); then
              printf 'secret-service setup exhausted: reason=operation-deadline-exhausted attempt_count=%d max_attempts=%d exit_code=124\n' \
                "$attempt" "$max_attempts" >&2
              exit 124
            fi

            printf 'secret-service setup retrying: classification=transient reason=%s attempt_count=%d backoff_seconds=%d jitter_seconds=%d\n' \
              "$last_failure_reason" "$attempt" "$backoff_seconds" "$jitter_seconds"
            sleep "$backoff_seconds"
          done

      - name: Install checksum-verified command-line tools
        shell: bash
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TEMP}/ctower-verification-tools"
          archive_root="${tool_root}/archives"
          binary_root="${tool_root}/bin"
          node_root="${tool_root}/node"
          mkdir -p "${archive_root}" "${binary_root}" "${node_root}"

          fetch() {
            local url="$1"
            local output="$2"
            local digest="$3"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --connect-timeout 15 --max-time 300 \
              --silent --show-error "${url}" --output "${output}"
            printf '%s  %s\n' "${digest}" "${output}" | sha256sum --check --status
          }

          node_archive="${archive_root}/node.tar.xz"
          fetch \
            "https://nodejs.org/dist/v${CTOWER_VERIFY_NODE}/node-v${CTOWER_VERIFY_NODE}-linux-x64.tar.xz" \
            "${node_archive}" "${CTOWER_VERIFY_NODE_SHA256}"
          tar --extract --xz --file "${node_archive}" --directory "${node_root}" \
            --strip-components=1

          just_archive="${archive_root}/just.tar.gz"
          fetch \
            "https://github.com/casey/just/releases/download/${CTOWER_VERIFY_JUST}/just-${CTOWER_VERIFY_JUST}-x86_64-unknown-linux-musl.tar.gz" \
            "${just_archive}" "${CTOWER_VERIFY_JUST_SHA256}"
          tar --extract --gzip --file "${just_archive}" --directory "${binary_root}" just

          actionlint_archive="${archive_root}/actionlint.tar.gz"
          fetch \
            "https://github.com/rhysd/actionlint/releases/download/v${CTOWER_VERIFY_ACTIONLINT}/actionlint_${CTOWER_VERIFY_ACTIONLINT}_linux_amd64.tar.gz" \
            "${actionlint_archive}" "${CTOWER_VERIFY_ACTIONLINT_SHA256}"
          tar --extract --gzip --file "${actionlint_archive}" \
            --directory "${binary_root}" actionlint

          gitleaks_archive="${archive_root}/gitleaks.tar.gz"
          fetch \
            "https://github.com/gitleaks/gitleaks/releases/download/v${CTOWER_VERIFY_GITLEAKS}/gitleaks_${CTOWER_VERIFY_GITLEAKS}_linux_x64.tar.gz" \
            "${gitleaks_archive}" "${CTOWER_VERIFY_GITLEAKS_SHA256}"
          tar --extract --gzip --file "${gitleaks_archive}" \
            --directory "${binary_root}" gitleaks

          fetch \
            "https://github.com/pnpm/pnpm/releases/download/v${CTOWER_VERIFY_PNPM}/pnpm-linux-x64" \
            "${binary_root}/pnpm" "${CTOWER_VERIFY_PNPM_SHA256}"
          chmod 0755 "${binary_root}/pnpm"

          printf '%s\n' "${node_root}/bin" "${binary_root}" >> "${GITHUB_PATH}"

      - name: Install frozen JavaScript verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Chromium build is chosen by the `@playwright/test` version the
      # lockfile pins, so this resolves to one exact browser per candidate.
      # `dogfood-inbox-controls` (DECISIONS D42 clause 4, renamed by D44) drives
      # the separate dogfood server with it; without the browser it fails by name.
      - name: Install lockfile-pinned verification-host browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Establish complete repository graph
        shell: bash
        run: |
          set -euo pipefail
          shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository=%s\n' "${shallow_state}"
          shallow_path="$(git rev-parse --git-path shallow)"
          if [[ "${shallow_state}" == "true" ]]; then
            printf '.git/shallow stat:\n'
            stat "${shallow_path}"
            printf '.git/shallow contents:\n'
            cat "${shallow_path}"
            printf 'origin/main=%s\n' "$(git rev-parse --verify 'origin/main^{commit}')"
            git fetch --unshallow origin
          fi
          final_shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository-after=%s\n' "${final_shallow_state}"
          if [[ "${final_shallow_state}" != "false" ]]; then
            printf 'repository graph must be complete\n' >&2
            exit 1
          fi

      - name: Run canonical warm gate
        run: just check

      - name: Establish complete repository graph
        shell: bash
        run: |
          set -euo pipefail
          shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository=%s\n' "${shallow_state}"
          shallow_path="$(git rev-parse --git-path shallow)"
          if [[ "${shallow_state}" == "true" ]]; then
            printf '.git/shallow stat:\n'
            stat "${shallow_path}"
            printf '.git/shallow contents:\n'
            cat "${shallow_path}"
            printf 'origin/main=%s\n' "$(git rev-parse --verify 'origin/main^{commit}')"
            git fetch --unshallow origin
          fi
          final_shallow_state="$(git rev-parse --is-shallow-repository)"
          printf 'is-shallow-repository-after=%s\n' "${final_shallow_state}"
          if [[ "${final_shallow_state}" != "false" ]]; then
            printf 'repository graph must be complete\n' >&2
            exit 1
          fi

      - name: Run canonical release gate
        run: just verify
