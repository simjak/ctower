[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "ctower-workspace"
version = "0.19.0"
description = "Ctower durable-work control plane"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "keyring>=25.7,<26",
  "packaging>=24,<27",
  "platformdirs>=4.5,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "referencing>=0.36,<1",
  "rfc8785>=0.1.4,<0.2",
  "ruamel.yaml>=0.19,<0.20",
  "SecretStorage>=3.4,<4; sys_platform == 'linux'",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ctl = "ctowerctl:main"
ctowerctl = "ctowerctl:main"
ctower-control-worker = "ctower_api.control_worker:main"
ctower-development-api = "ctower_api.development_runtime:api_main"
ctower-development-keyring-unlock = "tools.development_runtime:keyring_unlock_main"
ctower-development-worker = "ctower_api.development_runtime:worker_main"
ctower-private-vps = "tools.development_runtime:main"
ctower-runtime-manifest = "tools.runtime_manifest.__main__:main"
ctower-shadow-ctl = "tools.development_runtime.ctl:main"

[tool.setuptools]
include-package-data = false
packages = [
  "ctower_api",
  "ctower_api.connectors",
  "ctower_api.connectors.gitlab",
  "ctower_client",
  "ctower_contracts",
  "ctower_kernel",
  "ctower_kernel.access",
  "ctower_kernel.attention",
  "ctower_kernel.board_context",
  "ctower_kernel.catalog",
  "ctower_kernel.inbox",
  "ctower_kernel.integrations",
  "ctower_kernel.knowledge",
  "ctower_kernel.migration",
  "ctower_kernel.migrations",
  "ctower_kernel.objects",
  "ctower_kernel.projections",
  "ctower_kernel.proof",
  "ctower_kernel.record",
  "ctower_kernel.runtime",
  "ctower_kernel.telemetry",
  "ctower_kernel.work",
  "ctower_kernel.workflow",
  "ctowerctl",
  "ctowerctl.spool",
  "tools",
  "tools.development_runtime",
  "tools.runtime_manifest",
]

[tool.setuptools.package-dir]
ctower_api = "apps/ctower-api/src/ctower_api"
ctower_client = "generated/python/ctower_client"
ctower_contracts = "generated/python/ctower_contracts"
ctower_kernel = "packages/ctower-kernel/src/ctower_kernel"
"ctower_kernel.migrations" = "packages/ctower-kernel/migrations"
ctowerctl = "apps/ctowerctl/src/ctowerctl"
tools = "tools"
"tools.development_runtime" = "tools/development_runtime"
"tools.runtime_manifest" = "tools/runtime_manifest"

[tool.setuptools.package-data]
ctower_contracts = ["schemas.json"]
"ctower_kernel.migrations" = ["manifest.json", "*.sql"]
ctower_kernel = ["knowledge/static/**/*.md"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pydantic>=2.11,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "generated",
  "tests/repository/fixtures",
]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "ERA",
  "F", "FAST", "FBT", "FLY", "FURB", "I", "ICN", "INP", "LOG", "N", "PERF",
  "PIE", "PL", "PTH", "PYI", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "TRY",
  "UP", "W", "YTT",
]
ignore = ["D", "PLR0913", "PLR0917", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/acceptance/increment-1/**/*.py" = ["INP001"]
"tests/contracts/task-management/**/*.py" = ["INP001"]

[tool.ruff.lint.isort]
known-first-party = ["ctower_api", "ctower_client", "ctower_kernel", "ctowerctl", "tools"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
exclude = ["tests/repository/fixtures/"]
mypy_path = [
  "tests/type_overlays",
  "apps/ctower-api/src",
  "apps/ctowerctl/src",
  "generated/python",
  "packages/ctower-kernel/src",
  "tests",
  "tests/acceptance/increment-1",
]

# These byte-frozen traces import names installed dynamically by tests/conftest.py. Their
# imported types remain precise through tests/type_overlays and the checked shim package.
[[tool.mypy.overrides]]
module = [
  "modules.integrations.test_adapter_conformance",
  "modules.integrations.test_gitlab_sync",
  "modules.integrations.test_sync_service",
  "test_gitlab_integration",
]
disable_error_code = ["attr-defined", "unused-ignore"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [
  "apps/ctower-api/src",
  "apps/ctowerctl/src",
  "generated/python",
  "packages/ctower-kernel/src",
  "tests",
]

[tool.coverage.run]
branch = true
source = ["tools/checks"]
omit = ["tests/repository/fixtures/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
