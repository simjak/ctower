[project]
name = "ctower-workspace"
version = "0.0.0"
description = "Ctower durable-work control plane"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pydantic>=2.11,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "generated",
  "tests/repository/fixtures",
]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "ERA",
  "F", "FAST", "FBT", "FLY", "FURB", "I", "ICN", "INP", "LOG", "N", "PERF",
  "PIE", "PL", "PTH", "PYI", "RSE", "RUF", "S", "SIM", "SLOT", "T10", "TRY",
  "UP", "W", "YTT",
]
ignore = ["D", "PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ctower_api", "ctower_client", "ctower_kernel", "ctowerctl", "tools"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
exclude = ["tests/repository/fixtures/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tools/checks"]
omit = ["tests/repository/fixtures/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
