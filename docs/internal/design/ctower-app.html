<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ctower — the whole app, clickable (R3109 navigation shell)</title>

    <!--
      Companion to docs/internal/design/ctower-app.md.
      Open from disk. No build step, no network fetch, no product code.

      WHAT THIS IS: every top-level ctower screen, reachable, with the real
      left navigation. It is a NAVIGATION SHELL and a READ INVENTORY, not a
      visual design of twenty screens. Each route shows either the shape of a
      screen its reads can actually serve, or a declared absence naming the
      read that does not exist.

      WHY IT EXISTS: the authored surface is 104 operations — 35 reads and 69
      writes. A UI is almost entirely reads. So the question that decides
      whether ctower can have a browser product is not "what should the screens
      look like" but "which screens can be served at all", and that question is
      answerable today, exactly, from contracts/http/openapi.yaml.

      Tokens are duplicated from operator-cockpit.html because both files must
      open from disk with no build step. In the real app there is ONE token
      source (§3, D8) — the duplication is a property of the mockup format, not
      of the design.
    -->

    <style>
      :root {
        --font-sans: "InterVariable", "Inter", ui-sans-serif, system-ui,
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        --radius: 0.5rem;
        --radius-sm: calc(var(--radius) * 0.6);
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --border: oklch(0.922 0 0);
        --sidebar: oklch(0.985 0 0);
        --accent-soft: oklch(0.96 0 0);
        --state-working: #2563eb;
        --state-idle: #a8aeb2;
        --state-capped: #f59e0b;
        --state-error: #dc2626;
        --state-proven: #16a34a;
        --state-unknown: #7c3aed;
        --p-ctower: #7c3aed;
        --p-manibo: #0d9488;
        --p-bhloop: #be185d;
        --motion-duration-fast: 160ms;
        --motion-ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      }
      [data-theme="dark"] {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.175 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --border: oklch(0.269 0 0);
        --sidebar: oklch(0.175 0 0);
        --accent-soft: oklch(0.225 0 0);
        --state-unknown: #b191f0;
        --p-ctower: #b191f0;
        --p-manibo: #5fc9b0;
        --p-bhloop: #e58ab4;
      }
      @media (prefers-reduced-motion: reduce) { :root { --motion-duration-fast: 0ms; } }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
        color: var(--foreground);
        background: var(--background);
        -webkit-font-smoothing: antialiased;
      }
      .mono, code { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
      .dim { color: var(--muted-foreground); }
      .ic { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; flex: none; }

      /* ── shell ─────────────────────────────────────────────────────────── */
      .app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100dvh; }
      @media (max-width: 899px) { .app { grid-template-columns: minmax(0, 1fr); } .nav { display: none; } }

      .nav {
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding-bottom: 16px;
        display: flex;
        flex-direction: column;
      }
      .brand { display: flex; align-items: center; gap: 8px; padding: 12px 12px 14px; font-weight: 620; }
      .brand .mark { width: 16px; height: 16px; border-radius: 4px; background: var(--p-ctower); flex: none; }
      .navgrp {
        padding: 12px 12px 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 12px;
        color: var(--foreground);
        text-decoration: none;
        font-size: 12.5px;
      }
      .nav a:hover { background: var(--accent-soft); }
      .nav a[aria-current="page"] { background: var(--accent-soft); font-weight: 600; }
      .nav a .ic { color: var(--muted-foreground); }
      .nav a[aria-current="page"] .ic { color: var(--foreground); }
      /* a route with no read behind it is marked in the NAV, not only on the
         screen — otherwise the operator learns it is empty by walking into it */
      .nav a .absent { margin-left: auto; color: var(--state-unknown); }
      .nav .foot { margin-top: auto; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; }

      .main { overflow-y: auto; min-width: 0; }
      .crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 11px 22px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
        position: sticky;
        top: 0;
        background: var(--background);
        z-index: 3;
      }
      .crumb b { color: var(--foreground); font-weight: 600; }
      .crumb .spacer { flex: 1; }
      .page { padding: 20px 22px 60px; max-width: 1180px; }
      h1 { margin: 0 0 2px; font-size: 21px; font-weight: 640; letter-spacing: -0.015em; }
      .sub { margin: 0 0 20px; color: var(--muted-foreground); font-size: 12.5px; }
      h2 { margin: 26px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground); }


      /* FINDING-001 (design-review) — a keyboard operator got no focus ring at
         all on this surface. The ring is the working-state hue so it reads as
         "this is where you are", and it is offset so it never sits under the
         1px borders this design uses everywhere. */
      :where(a, button, [tabindex]):focus-visible {
        outline: 2px solid var(--state-working);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      .ghost {
        font: inherit; font-size: 11.5px;
        color: var(--muted-foreground);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 3px 9px;
        cursor: pointer;
      }
      .ghost:hover { color: var(--foreground); background: var(--accent-soft); }

      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        white-space: nowrap; font-size: 11.5px; font-weight: 500;
        color: var(--foreground);
      }
      .chip > .ic { color: var(--sc); }
      .sc-working { --sc: var(--state-working); }
      .sc-idle { --sc: var(--state-idle); }
      .sc-capped { --sc: var(--state-capped); }
      .sc-error { --sc: var(--state-error); }
      .sc-proven { --sc: var(--state-proven); }
      .sc-unknown { --sc: var(--state-unknown); }

      /* ── the declared absence ──────────────────────────────────────────
         The most common screen in this file, and the point of it. It states
         what cannot be shown, what the missing read is, and — critically —
         what the API CAN already do here, because "no screen" and "no
         capability" are different facts and a blank page conflates them. */
      .absent-panel {
        border: 1px solid var(--border);
        border-left: 2px solid var(--state-unknown);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        max-width: 640px;
        background: var(--card);
      }
      .absent-panel h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
      .absent-panel p { margin: 0 0 10px; font-size: 12.5px; color: var(--muted-foreground); }
      .opgrid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 11.5px; align-items: baseline; }
      .opgrid dt { color: var(--muted-foreground); }
      .opgrid dd { margin: 0; font-family: var(--font-mono); font-size: 11px; }

      /* ── generic screen furniture ──────────────────────────────────────── */
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
      .card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; background: var(--card); }
      .card .k { font-size: 11px; color: var(--muted-foreground); }
      .card .v { font-size: 20px; font-weight: 620; letter-spacing: -0.01em; margin-top: 2px; }
      .card .v.sm { font-size: 13px; font-weight: 550; }

      .rows { border-top: 1px solid var(--border); }
      .row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        padding: 8px 2px;
        border-bottom: 1px solid var(--border);
        font-size: 12.5px;
      }
      .row .key { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
      .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .meta { color: var(--muted-foreground); font-size: 11.5px; }

      .empty { padding: 16px 0; font-size: 12.5px; }
      .empty .act { margin-top: 8px; }

      table.map { border-collapse: collapse; width: 100%; font-size: 12px; }
      table.map th, table.map td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
      table.map th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); font-weight: 600; }
      table.map td.n { font-family: var(--font-mono); font-size: 11px; }

      .i {
        display: inline-flex; align-items: center; justify-content: center;
        width: 13px; height: 13px; padding: 0; flex: none;
        border: 1px solid var(--border); border-radius: 50%;
        background: transparent; color: var(--muted-foreground);
        font: inherit; font-size: 9px; font-style: italic; line-height: 1; cursor: help;
      }
      .i:hover { color: var(--foreground); border-color: var(--muted-foreground); }
      [hidden] { display: none !important; }
    </style>
  </head>

    <script>
      // ────────────────────────────────────────────────────────────────────
      // THE MENU IS THE OPERATOR'S JOBS, NOT THE API'S PATHS.
      //
      // The first version of this file generated one nav row per top-level
      // OpenAPI path prefix — 22 rows of ctower's internal nouns (spawn
      // records, intake, attention, rulings, digests). That is a faithful map
      // of the backend's decomposition and a bad menu, because nobody wakes up
      // wanting to do "spawn records". It is the same failure as labelling a
      // file group "collectable": naming a thing after its implementation.
      //
      // This menu is built from what an operator DOES, and everything that is
      // not a daily job either lives inside a screen that already exists or
      // sits behind one Admin door.
      //
      // TWO MODES, because this file has two audiences:
      //   Operator (default) — only destinations that can actually be served.
      //   Design             — adds the unserveable ones with their gap, plus
      //                        the read/write counts. That inventory is real
      //                        work and belongs in ctower-app.md; it is here
      //                        as an overlay, never as the product.
      // ────────────────────────────────────────────────────────────────────
      var SCREENS = [
        { grp: "Work", id: "lanes", name: "Lanes", icon: "n-cockpit",
          lead: "Everything running right now.",
          body: "lanes", opens: "operator-cockpit.html",
          reads: ["listSpawnRecords", "listProjectSessions", "readPoolLimits"], writes: 0 },

        { grp: "Work", id: "board", name: "Board", icon: "n-board",
          lead: "Work in flight, by ticket.",
          body: "board", reads: ["getBoard"], writes: 0,
          design: "getBoard is the only portfolio read on the surface, so this is the only door into a ticket." },

        { grp: "Work", id: "inbox", name: "Inbox", icon: "n-inbox",
          lead: "Messages between seats and you.",
          body: "inbox",
          reads: ["listInboxThreads", "readInboxThread", "listInboxCorrespondents", "readInboxMessageState"], writes: 4 },

        { grp: "Setup", id: "crews", name: "Crews", icon: "n-crew",
          lead: "Who works here, and whether they are ready to.",
          body: "crews", opens: "operator-cockpit.html",
          reads: ["listSpawnRecords", "readPoolLimits"], writes: 2,
          design: "Absorbs seat credentials (2 writes, no read — G12) and the harness registry (no path at all — G2)." },

        { grp: "Setup", id: "costs", name: "Costs", icon: "n-cost",
          lead: "Credits, quota and what is about to run out.",
          body: "costs", reads: ["readPoolLimits"], writes: 1 },

        { grp: "Setup", id: "projects", name: "Projects", icon: "n-proj",
          lead: "Repositories and their delivery history.",
          body: "projects",
          reads: ["listProjectSessions", "listProjectEvents", "getProjectDelivery", "getMovementAtom", "listTicketMovement"], writes: 0 },

        { grp: "System", id: "admin", name: "Admin", icon: "n-migrate",
          lead: "Rarely, and usually because something is wrong.",
          body: "admin",
          reads: ["getControlHealth", "getCtowerProjectImportRun", "getCtowerProjectCutoverHealth", "listRulings", "listKnowledgeDocuments", "listRequests", "getMorningDigest"], writes: 30,
          design: "One door for eleven API areas that were eleven menu rows. Each is a section, not a destination." },

        // ── design-mode only: the destinations that cannot be served ────────
        { grp: "Cannot be served", id: "harness", name: "Harness", icon: "n-harness",
          designOnly: true, gap: "G2", reads: [], writes: 0,
          lead: "The harness registry has no HTTP surface at all.",
          absent: "No /v1/harness path exists — not one operation, read or write. HarnessSpec is real (key, revision, digests, declared capabilities, liveness sources, survey answers) and served nowhere. In Operator mode this is not a menu row; it is the empty half of the Crews screen." },

        { grp: "Cannot be served", id: "tickets", name: "Ticket list", icon: "n-ticket",
          designOnly: true, gap: "G11", reads: [], writes: 18,
          lead: "There is no way to enumerate tickets.",
          absent: "All six ticket reads require a ticket_id you already hold. Nothing lists them. That is why Board is the only door, and why a ticket absent from the board is unreachable by any read in the product." },

        { grp: "Cannot be served", id: "queues", name: "Write-only queues", icon: "n-bell",
          designOnly: true, gap: "G12", reads: [], writes: 7,
          lead: "Four things you can act on and never see.",
          absent: "Attention findings, the intake stream, the seat-credential register and poisoned outbox messages: nine writes across four areas, zero reads between them. Each is a queue with no way to see the queue. The seat-credential one is security-relevant — nobody can audit who holds what." }
      ];

      var el = function (t, c, h) { var n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
      var mark = function (s, sc) { return '<svg class="ic ' + (sc || "") + '"><use href="#' + s + '"/></svg>'; };
      var design = false;

      function visible() {
        return SCREENS.filter(function (s) { return design || !s.designOnly; });
      }

      function nav() {
        var box = document.getElementById("navlinks");
        box.innerHTML = "";
        var last = null;
        visible().forEach(function (s) {
          if (s.grp !== last) { box.appendChild(el("div", "navgrp", s.grp)); last = s.grp; }
          var a = el("a", null, mark(s.icon) + "<span>" + s.name + "</span>" +
            (s.designOnly ? '<span class="absent" title="no read serves this">' + mark("m-unknown") + "</span>" : ""));
          a.href = "#/" + s.id;
          a.id = "nav-" + s.id;
          box.appendChild(a);
        });
      }

      var ROW = function (a, b, c, sc, m) {
        return '<span class="key">' + a + "</span><span class=t>" + b + "</span>" +
               '<span class="meta"></span><span class="chip ' + sc + '">' + mark(m) + c + "</span>";
      };

      var BODY = {
        lanes: function () {
          var w = el("div"), r = el("div", "rows");
          [["designer-cockpit-2", "cockpit-design", "working", "sc-working", "m-working"],
           ["engineer-seam", "adapter-codex", "capped", "sc-capped", "m-capped"],
           ["engineer-seam", "seam-conformance", "idle", "sc-idle", "m-idle"],
           ["reviewer-intake", "intake-fence", "working", "sc-working", "m-working"],
           ["voice-transcribe", "whisper-bench", "dead", "sc-error", "m-dead"]].forEach(function (x) {
            r.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          w.appendChild(r);
          w.appendChild(el("p", "sub", "Open one to watch it, talk to it, and see what it changed."));
          return w;
        },
        board: function () {
          var r = el("div", "rows");
          [["CT-I1-041", "Harness adapter seam — merged binding", "working", "sc-working", "m-working"],
           ["CT-I1-042", "claude-code binding conformance", "working", "sc-working", "m-working"],
           ["CT-I1-027", "Console view grants", "gated", "sc-capped", "m-capped"],
           ["CT-I1-044", "Survey and classification", "idle", "sc-idle", "m-idle"],
           ["CT-I1-013", "Human session foundation", "delivered", "sc-proven", "m-proven"]].forEach(function (x) {
            r.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          return r;
        },
        inbox: function () {
          var r = el("div", "rows");
          [["ctower-commander", "Cockpit r3 — three cells to sign-off", "3 new", "sc-working", "m-working"],
           ["reviewer-intake", "Intake fence: two proposals", "read", "sc-idle", "m-idle"]].forEach(function (x) {
            r.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          return r;
        },
        crews: function () {
          var w = el("div"), r = el("div", "rows");
          [["designer-cockpit-2", "Designer · ctower", "ready", "sc-proven", "m-proven"],
           ["engineer-seam", "Engineer · ctower", "not ready", "sc-capped", "m-capped"],
           ["voice-transcribe", "Engineer · bhloop", "sign-in needed", "sc-error", "m-dead"]].forEach(function (x) {
            r.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          w.appendChild(r);
          w.appendChild(el("p", "sub", "A crew's page carries its readiness, credentials and configuration."));
          return w;
        },
        costs: function () {
          return el("div", "cards",
            '<div class=card><div class=k>Credits this month</div><div class="v">16 024<span class="dim" style="font-size:12px"> mcr</span></div></div>' +
            '<div class=card><div class=k>Accounts usable</div><div class="v">1<span class="dim" style="font-size:12px"> of 3</span></div></div>' +
            '<div class=card><div class=k>Next reset</div><div class="v sm">04:12Z</div></div>' +
            '<div class=card><div class=k>Monthly cap</div><div class="v sm"><span class="chip sc-unknown">' + mark("m-unknown") + "not set</span></div></div>");
        },
        projects: function () {
          var r = el("div", "rows");
          [["ctower", "7 lanes · 3 tickets in flight", "active", "sc-working", "m-working"],
           ["manibo", "2 lanes · 1 ticket in flight", "active", "sc-working", "m-working"],
           ["bhloop", "1 lane", "attention", "sc-error", "m-dead"]].forEach(function (x) {
            r.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          return r;
        },
        admin: function () {
          var w = el("div");
          [["Health", "Control plane", "ok", "sc-proven", "m-proven"],
           ["Migrations", "No import running", "idle", "sc-idle", "m-idle"],
           ["Requests", "4 open", "open", "sc-working", "m-working"],
           ["Rulings", "2 agreements", "—", "sc-idle", "m-idle"],
           ["Knowledge", "31 documents", "—", "sc-idle", "m-idle"],
           ["Morning digest", "Delivered 06:00Z", "—", "sc-idle", "m-idle"]].forEach(function (x) {
            w.appendChild(el("div", "row", ROW(x[0], x[1], x[2], x[3], x[4])));
          });
          var r = el("div", "rows"); while (w.firstChild) r.appendChild(w.firstChild);
          var out = el("div"); out.appendChild(r);
          out.appendChild(el("p", "sub", "Each of these was a top-level menu row in the first draft. None of them is a daily job."));
          return out;
        }
      };

      function render() {
        var id = (location.hash || "#/lanes").replace("#/", "");
        var all = visible();
        var s = all.filter(function (x) { return x.id === id; })[0] || all[0];
        all.forEach(function (x) {
          var a = document.getElementById("nav-" + x.id);
          if (!a) return;
          if (x.id === s.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
        });
        document.getElementById("crumb-group").textContent = s.grp;
        document.getElementById("crumb-page").textContent = s.name;
        document.getElementById("crumb-state").innerHTML = design
          ? '<span class="dim mono">' + s.reads.length + (s.reads.length === 1 ? " read · " : " reads · ") +
            s.writes + (s.writes === 1 ? " write</span>" : " writes</span>")
          : "";

        var p = document.getElementById("page");
        p.innerHTML = "";
        p.appendChild(el("h1", null, s.name));
        p.appendChild(el("p", "sub", s.lead));

        if (s.designOnly) {
          var d = el("div", "absent-panel");
          d.innerHTML = '<h3><span class="chip sc-unknown">' + mark("m-unknown") +
            "</span> No read serves this</h3><p>" + s.absent + '</p><dl class="opgrid"><dt>Missing</dt><dd>' +
            s.gap + "</dd><dt>Reads</dt><dd>0</dd><dt>Writes</dt><dd>" + s.writes + "</dd></dl>";
          p.appendChild(d);
        } else {
          if (BODY[s.body]) p.appendChild(BODY[s.body]());
          if (s.opens) {
            p.appendChild(el("p", "sub",
              'Designed in full: <a href="' + s.opens + '">' + s.opens + "</a> ↗"));
          }
          // DESIGN MODE ONLY. In Operator mode the screen says nothing about
          // which operation serves it, because that is a fact about ctower's
          // construction and not about the operator's work.
          if (design) {
            p.appendChild(el("h2", null, "Design · served by"));
            var dl = el("dl", "opgrid");
            dl.innerHTML = s.reads.map(function (r) { return "<dt>read</dt><dd>" + r + "</dd>"; }).join("") +
              (s.writes ? "<dt>writes</dt><dd>" + s.writes + "</dd>" : "");
            p.appendChild(dl);
            if (s.design) p.appendChild(el("p", "sub", s.design));
          }
        }
        window.scrollTo(0, 0);
      }

      function setMode(on) {
        design = on;
        document.getElementById("mode").textContent = design ? "Operator view" : "Design view";
        document.body.dataset.mode = design ? "design" : "operator";
        nav(); render();
      }

      nav();
      window.addEventListener("hashchange", render);
      document.getElementById("mode").addEventListener("click", function () { setMode(!design); });
      document.getElementById("theme").addEventListener("click", function () {
        var e = document.documentElement;
        e.dataset.theme = e.dataset.theme === "dark" ? "light" : "dark";
      });
      render();
    </script>
  </body>
</html>
