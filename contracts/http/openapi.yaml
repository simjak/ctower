      "SessionTokenUsage": {
        "type": "object", "additionalProperties": false,
        "required": ["input_tokens", "output_tokens", "total_tokens"],
        "properties": {
          "input_tokens": {"type": "integer", "minimum": 0, "maximum": 1000000000},
          "output_tokens": {"type": "integer", "minimum": 0, "maximum": 1000000000},
          "total_tokens": {"type": "integer", "minimum": 0, "maximum": 2000000000}
        }
      },
      "TicketSession": {
        "type": "object", "additionalProperties": false,
        "required": ["branch_ref", "closed_at", "crew_name", "duration_seconds", "evidence_ref", "harness_ref", "model_ref", "outcome", "project_key", "seat_key", "session_id", "started_at", "state", "ticket_id", "tokens", "transition_count", "worktree_ref"],
        "properties": {
          "branch_ref": {"type": "string", "minLength": 1, "maxLength": 256},
          "closed_at": {"type": ["string", "null"], "format": "date-time"},
          "crew_name": {"type": "string", "pattern": "^[a-z][a-z0-9._-]{1,95}$"},
          "duration_seconds": {"type": ["integer", "null"], "minimum": 0, "maximum": 31536000},
          "evidence_ref": {"type": ["string", "null"], "minLength": 1, "maxLength": 256},
          "harness_ref": {"type": "string", "minLength": 1, "maxLength": 64},
          "model_ref": {"type": "string", "minLength": 1, "maxLength": 128},
          "outcome": {"oneOf": [{"$ref": "#/components/schemas/SessionOutcome"}, {"type": "null"}]},
          "project_key": {"type": "string", "pattern": "^[a-z][a-z0-9-]{2,63}$"},
          "seat_key": {"type": "string", "pattern": "^[a-z][a-z0-9._-]{1,95}$"},
          "session_id": {"type": "string", "format": "uuid"},
          "started_at": {"type": "string", "format": "date-time"},
          "state": {"$ref": "#/components/schemas/SessionState"},
          "ticket_id": {"type": "string", "format": "uuid"},
          "tokens": {"oneOf": [{"$ref": "#/components/schemas/SessionTokenUsage"}, {"type": "null"}]},
          "transition_count": {"type": "integer", "minimum": 0},
          "worktree_ref": {"type": "string", "minLength": 1, "maxLength": 256}
        }
      },
      "TicketSessionList": {
        "type": "object", "additionalProperties": false,
        "required": ["sessions", "ticket_id"],
        "properties": {
          "sessions": {"type": "array", "items": {"$ref": "#/components/schemas/TicketSession"}},
          "ticket_id": {"type": "string", "format": "uuid"}
        }
      },
      "ProjectSessionPage": {
        "type": "object", "additionalProperties": false,
        "required": ["next_cursor", "project_key", "sessions"],
        "properties": {
          "next_cursor": {"type": ["integer", "null"], "minimum": 1},
          "project_key": {"type": "string", "pattern": "^[a-z][a-z0-9-]{2,63}$"},
          "sessions": {"type": "array", "items": {"$ref": "#/components/schemas/TicketSession"}}
        }
      },
      "AuditEvent": {
        "oneOf": [
          {"$ref": "#/components/schemas/TicketCreatedAuditEvent"},
          {"$ref": "#/components/schemas/CustodyTransferredAuditEvent"},
          {"$ref": "#/components/schemas/TicketCommentAddedAuditEvent"},
          {"$ref": "#/components/schemas/WorkChangedAuditEvent"},
          {"$ref": "#/components/schemas/WorkflowChangedAuditEvent"},
          {"$ref": "#/components/schemas/ProofChangedAuditEvent"},
          {"$ref": "#/components/schemas/SessionStartedAuditEvent"},
          {"$ref": "#/components/schemas/SessionTransitionedAuditEvent"},
          {"$ref": "#/components/schemas/SessionClosedAuditEvent"}
        ]
      },
      "AuditPage": {
        "type": "object", "additionalProperties": false,
        "required": ["events", "next_cursor", "ticket_id"],
        "properties": {
          "events": {"type": "array", "items": {"$ref": "#/components/schemas/AuditEvent"}},
          "next_cursor": {"type": ["integer", "null"], "minimum": 1},
          "ticket_id": {"type": "string", "format": "uuid"}
        }
      },
      "ProjectEvent": {
        "oneOf": [
          {"$ref": "#/components/schemas/TicketCreatedAuditEvent"},
          {"$ref": "#/components/schemas/CustodyTransferredAuditEvent"},
          {"$ref": "#/components/schemas/TicketCommentAddedAuditEvent"},
          {"$ref": "#/components/schemas/WorkChangedAuditEvent"},
          {"$ref": "#/components/schemas/WorkflowChangedAuditEvent"},
          {"$ref": "#/components/schemas/ProofChangedAuditEvent"}
        ]
      },
      "ProjectEventPage": {
        "type": "object", "additionalProperties": false,
        "required": ["events", "next_cursor", "project_key"],
        "properties": {
          "events": {"type": "array", "items": {"$ref": "#/components/schemas/ProjectEvent"}},
          "next_cursor": {"type": ["integer", "null"], "minimum": 1},
          "project_key": {"type": "string", "pattern": "^[a-z][a-z0-9-]{2,63}$"}
        }
      },
      "TimelineEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": ["actor_principal_id", "command_id", "event_id", "kind", "occurred_at", "payload", "sequence"],
        "properties": {
          "actor_principal_id": {"type": "string", "format": "uuid"},
          "command_id": {"type": "string", "format": "uuid"},
          "event_id": {"type": "string", "format": "uuid"},
          "kind": {
            "type": "string",
            "enum": ["ticket.created", "ticket.custody_transferred", "ticket.comment_added"]
          },
          "occurred_at": {"type": "string", "format": "date-time"},
          "payload": {
            "oneOf": [
              {"$ref": "#/components/schemas/TicketCreatedPayload"},
              {"$ref": "#/components/schemas/CustodyTransferredPayload"},
              {"$ref": "#/components/schemas/TicketCommentAddedPayload"}
            ]
          },
          "sequence": {"type": "integer", "minimum": 1}
        }
      },
      "TimelineResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["durability_state", "events", "ticket_id"],
        "properties": {
          "durability_state": {"$ref": "#/components/schemas/DurabilityState"},
          "events": {"type": "array", "items": {"$ref": "#/components/schemas/TimelineEvent"}},
          "ticket_id": {"type": "string", "format": "uuid"}
        }
      }
    }
  }
}
