  "components": {
    "headers": {
      "RetryAfter": {
        "description": "Seconds before replaying the same idempotency key",
        "schema": {"type": "integer", "minimum": 1, "maximum": 60}
      }
    },
    "securitySchemes": {
      "bearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "opaque"}
    },
    "parameters": {
      "BootstrapCapability": {
        "name": "X-Ctower-Bootstrap-Capability",
        "in": "header",
        "required": true,
        "schema": {"type": "string", "minLength": 32, "maxLength": 256}
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {"type": "string", "format": "uuid"}
      },
      "TicketId": {
        "name": "ticket_id",
        "in": "path",
        "required": true,
        "schema": {"type": "string", "format": "uuid"}
      },
      "OutboxId": {
        "name": "outbox_id",
        "in": "path",
        "required": true,
        "schema": {"type": "string", "format": "uuid"}
      },
      "SyntheticRunId": {
        "name": "run_id",
        "in": "path",
        "required": true,
        "schema": {"type": "string", "format": "uuid"}
      },
      "AuditCursor": {
        "name": "cursor", "in": "query", "required": false,
        "schema": {"type": "integer", "minimum": 0, "default": 0}
      },
      "AuditLimit": {
        "name": "limit", "in": "query", "required": false,
        "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}
      },
      "BoardLaneFilter": {
        "name": "lane", "in": "query", "required": false,
        "schema": {"type": "string", "enum": ["backlog", "ready", "in_progress", "in_review", "blocked", "complete"]}
      },
      "PriorityFilter": {
        "name": "priority", "in": "query", "required": false,
        "schema": {"type": "string", "enum": ["P0", "P1", "P2"]}
      },
      "StageFilter": {
        "name": "stage_key", "in": "query", "required": false,
        "schema": {"type": "string", "pattern": "^[a-z][a-z0-9._-]*$"}
      },
      "CustodianFilter": {
        "name": "custodian_id", "in": "query", "required": false,
        "schema": {"type": "string", "format": "uuid"}
      },
      "AssigneeFilter": {
        "name": "assignee_id", "in": "query", "required": false,
        "schema": {"type": "string", "format": "uuid"}
      }
    },
    "responses": {
      "ProblemResponse": {
        "description": "RFC 9457 problem",
        "content": {
          "application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}
        }
      }
    },
    "schemas": {
      "BootstrapRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "commander_name",
          "commander_vault_ref",
          "operator_credential_ref",
          "operator_name",
          "operator_vault_ref",
          "tenant_name",
          "tenant_slug"
        ],
        "properties": {
          "commander_name": {"type": "string", "minLength": 1, "maxLength": 120},
          "commander_vault_ref": {"type": "string", "pattern": "^vault-ref:[a-z0-9/_-]+$"},
          "operator_credential_ref": {"type": "string", "pattern": "^credential-ref:[a-z0-9/_-]+$"},
          "operator_name": {"type": "string", "minLength": 1, "maxLength": 120},
          "operator_vault_ref": {"type": "string", "pattern": "^vault-ref:[a-z0-9/_-]+$"},
          "tenant_name": {"type": "string", "minLength": 1, "maxLength": 120},
          "tenant_slug": {"type": "string", "pattern": "^[a-z][a-z0-9-]{1,62}$"}
        }
      },
      "BootstrapReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "command_id",
          "commander_id",
          "durability_state",
          "event_ids",
          "operator_id",
          "receipt_digest",
          "tenant_id"
        ],
        "properties": {
          "command_id": {"type": "string", "format": "uuid"},
          "commander_id": {"type": "string", "format": "uuid"},
          "durability_state": {"$ref": "#/components/schemas/DurabilityState"},
          "event_ids": {"type": "array", "minItems": 1, "items": {"type": "string", "format": "uuid"}},
          "operator_id": {"type": "string", "format": "uuid"},
          "receipt_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "tenant_id": {"type": "string", "format": "uuid"}
        }
      },
      "CustodyTransferRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["expected_version", "from_custodian_id", "protected_transfer", "reason", "to_custodian_id"],
        "properties": {
          "expected_version": {"type": "integer", "minimum": 1},
          "from_custodian_id": {"type": "string", "format": "uuid"},
          "protected_transfer": {"type": "boolean"},
          "reason": {"type": "string", "minLength": 1, "maxLength": 500},
          "to_custodian_id": {"type": "string", "format": "uuid"}
        }
      },
      "DurabilityState": {"type": "string", "enum": ["durability_pending", "accepted"]},
      "SyntheticRunState": {
        "type": "string", "enum": ["pending", "running", "succeeded", "failed"]
      },
      "SyntheticRunRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["workflow_ref"],
        "properties": {
          "workflow_ref": {"const": "ctower.trust-spine-four-stage@1"}
        }
      },
      "SyntheticRunReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": ["command_id", "durability_state", "event_ids", "job_id", "run_id", "workflow_ref"],
        "properties": {
          "command_id": {"type": "string", "format": "uuid"},
          "durability_state": {"$ref": "#/components/schemas/DurabilityState"},
          "event_ids": {"type": "array", "minItems": 1, "items": {"type": "string", "format": "uuid"}},
          "job_id": {"type": "string", "format": "uuid"},
          "run_id": {"type": "string", "format": "uuid"},
          "workflow_ref": {"const": "ctower.trust-spine-four-stage@1"}
        }
      },
      "SyntheticRunResource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "attempt_count", "completed_at", "created_at", "detail_code", "job_id",
          "lifecycle_facts", "run_id", "state", "ticket_id", "workflow_ref"
        ],
        "properties": {
          "attempt_count": {"type": "integer", "minimum": 0, "maximum": 8},
          "completed_at": {"type": ["string", "null"], "format": "date-time"},
          "created_at": {"type": "string", "format": "date-time"},
          "detail_code": {"type": ["string", "null"], "pattern": "^[a-z][a-z0-9._-]{2,95}$"},
          "job_id": {"type": "string", "format": "uuid"},
          "lifecycle_facts": {
            "type": "array", "maxItems": 2,
            "items": {"type": "string", "enum": ["resolved", "closed"]}
          },
          "run_id": {"type": "string", "format": "uuid"},
          "state": {"$ref": "#/components/schemas/SyntheticRunState"},
          "ticket_id": {"type": ["string", "null"], "format": "uuid"},
          "workflow_ref": {"const": "ctower.trust-spine-four-stage@1"}
        }
      },
      "ComponentKind": {
        "type": "string",
        "enum": [
          "workflow",
          "execution_policy",
          "gate_policy",
          "evidence_policy",
          "goal",
          "project",
          "agent_profile",
          "persona",
          "skill",
          "tool",
          "capability",
          "environment",
          "image",
          "harness",
          "supervisor",
          "target",
          "workspace",
          "telemetry",
          "placement_policy",
          "extension",
          "cadence_policy",
          "notification",
          "integration",
          "adapter"
        ]
      },
      "ComponentReference": {
        "type": "object",
        "additionalProperties": false,
        "required": ["content_digest", "key", "kind", "revision"],
        "properties": {
          "content_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "key": {"type": "string", "pattern": "^[a-z][a-z0-9.-]{2,127}$"},
          "kind": {"$ref": "#/components/schemas/ComponentKind"},
          "revision": {"type": "integer", "minimum": 1}
        }
      },
      "ComponentScope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["project", "tenant"],
        "properties": {
          "project": {"type": ["string", "null"], "pattern": "^[a-z][a-z0-9.-]{2,127}$"},
          "tenant": {"type": "string", "pattern": "^[a-z][a-z0-9-]{2,63}$"}
        }
      },
      "ComponentCompatibility": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ctower", "requires"],
        "properties": {
          "ctower": {"type": "string", "minLength": 1, "maxLength": 80},
          "requires": {
            "type": "array",
            "maxItems": 128,
            "items": {"$ref": "#/components/schemas/ComponentReference"}
          }
        }
      },
      "ComponentProvenance": {
        "type": "object",
        "additionalProperties": false,
        "required": ["digest", "kind", "source"],
        "properties": {
          "digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "kind": {"type": "string", "pattern": "^[a-z][a-z0-9._-]{1,63}$"},
          "source": {"type": "string", "minLength": 1, "maxLength": 512}
        }
      },
      "VersionedComponent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "compatibility",
          "content_digest",
          "key",
          "kind",
          "lifecycle",
          "payload_ref",
          "provenance",
          "revision",
          "schema",
          "schema_ref",
          "scope"
        ],
        "properties": {
          "compatibility": {"$ref": "#/components/schemas/ComponentCompatibility"},
          "content_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "key": {"type": "string", "pattern": "^[a-z][a-z0-9.-]{2,127}$"},
          "kind": {"$ref": "#/components/schemas/ComponentKind"},
          "lifecycle": {"type": "string", "enum": ["draft", "published", "deprecated", "revoked"]},
          "payload_ref": {"type": "string", "pattern": "^object:sha256:[0-9a-f]{64}$"},
          "provenance": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {"$ref": "#/components/schemas/ComponentProvenance"}
          },
          "revision": {"type": "integer", "minimum": 1},
          "schema": {"const": "ctower.versioned-component/v1"},
          "schema_ref": {"type": "string", "pattern": "^ctower\\.[a-z][a-z0-9.-]*/v[1-9][0-9]*$"},
          "scope": {"$ref": "#/components/schemas/ComponentScope"},
          "supersedes": {"$ref": "#/components/schemas/ComponentReference"}
        }
      },
      "CompanyIdentity": {
        "type": "object",
        "additionalProperties": false,
        "required": ["display_name", "key"],
        "properties": {
          "display_name": {"type": "string", "minLength": 1, "maxLength": 128},
          "key": {"type": "string", "pattern": "^[a-z][a-z0-9-]{2,63}$"}
        }
      },
      "CompanyBundleResource": {
        "type": "object",
        "additionalProperties": false,
        "required": ["component", "payload"],
        "properties": {
          "component": {"$ref": "#/components/schemas/VersionedComponent"},
          "payload": {"type": "object"}
        }
      },
      "CompanyBundleAssignment": {
        "type": "object",
        "additionalProperties": false,
        "required": ["component", "slot", "subject"],
        "properties": {
          "component": {"$ref": "#/components/schemas/ComponentReference"},
          "slot": {"type": "string", "pattern": "^[a-z][a-z0-9._-]{1,63}$"},
          "subject": {"type": "string", "pattern": "^[a-z][a-z0-9._-]*:[a-z][a-z0-9._-]*$"}
        }
      },
      "SecretBindingReference": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "reference_class"],
        "properties": {
          "name": {"type": "string", "pattern": "^[A-Z][A-Z0-9_]{2,127}$"},
          "reference_class": {
            "type": "string",
            "enum": ["os-credential", "vault-path", "runtime-binding"]
          }
        }
      },
      "CompanyBundleDocument": {
        "type": "object",
        "additionalProperties": false,
        "required": ["assignments", "company", "resources", "schema", "secret_binding_refs"],
        "properties": {
          "assignments": {
            "type": "array",
            "maxItems": 512,
            "items": {"$ref": "#/components/schemas/CompanyBundleAssignment"}
          },
          "company": {"$ref": "#/components/schemas/CompanyIdentity"},
          "resources": {
            "type": "array",
            "minItems": 1,
            "maxItems": 512,
            "items": {"$ref": "#/components/schemas/CompanyBundleResource"}
          },
          "schema": {"const": "ctower.company-bundle/v1"},
          "secret_binding_refs": {
            "type": "array",
            "maxItems": 128,
            "items": {"$ref": "#/components/schemas/SecretBindingReference"}
          }
        }
      },
      "CompanyBundleRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["bundle"],
        "properties": {
          "bundle": {"$ref": "#/components/schemas/CompanyBundleDocument"}
        }
      },
      "BundleCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "status"],
        "properties": {
          "code": {"type": "string", "pattern": "^[a-z][a-z0-9._-]{1,95}$"},
          "status": {"type": "string", "enum": ["passed", "warning"]}
        }
      },
      "BundleActionKind": {
        "type": "string",
        "enum": [
          "create",
          "reuse_exact",
          "supersede",
          "deprecate",
          "assignment_change",
          "pointer_change",
          "no_op"
        ]
      },
      "BundleAction": {
        "type": "object",
        "additionalProperties": false,
        "required": ["component", "kind"],
        "properties": {
          "component": {"$ref": "#/components/schemas/ComponentReference"},
          "kind": {"$ref": "#/components/schemas/BundleActionKind"}
        }
      },
      "CompanyBundleValidationResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["bundle_digest", "checks", "valid", "warnings"],
        "properties": {
          "bundle_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "checks": {"type": "array", "items": {"$ref": "#/components/schemas/BundleCheck"}},
          "valid": {"type": "boolean"},
          "warnings": {"type": "array", "items": {"type": "string", "maxLength": 500}}
        }
      },
      "CompanyBundlePlan": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "actions",
          "base_bundle_digest",
          "base_version",
          "checks",
          "plan_digest",
          "proposed_bundle_digest",
          "warnings"
        ],
        "properties": {
          "actions": {"type": "array", "items": {"$ref": "#/components/schemas/BundleAction"}},
          "base_bundle_digest": {
            "type": ["string", "null"],
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "base_version": {"type": "integer", "minimum": 0},
          "checks": {"type": "array", "items": {"$ref": "#/components/schemas/BundleCheck"}},
          "plan_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "proposed_bundle_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "warnings": {"type": "array", "items": {"type": "string", "maxLength": 500}}
        }
      },
      "CompanyBundleApplyRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["bundle", "expected_active_version", "plan_digest"],
        "properties": {
          "bundle": {"$ref": "#/components/schemas/CompanyBundleDocument"},
          "expected_active_version": {"type": "integer", "minimum": 0},
          "plan_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
        }
      },
      "CompanyBundleCommandResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "active_version",
          "bundle_digest",
          "command_id",
          "durability_state",
          "event_ids",
          "plan_digest"
        ],
        "properties": {
          "active_version": {"type": "integer", "minimum": 1},
          "bundle_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "command_id": {"type": "string", "format": "uuid"},
          "durability_state": {"$ref": "#/components/schemas/DurabilityState"},
          "event_ids": {
            "type": "array",
            "minItems": 1,
            "items": {"type": "string", "format": "uuid"}
          },
          "plan_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}
        }
      },
      "CompanyBundleExportMetadata": {
        "type": "object",
        "additionalProperties": false,
        "required": ["activated_at", "actor_principal_id", "checks", "command_id"],
        "properties": {
          "activated_at": {"type": "string", "format": "date-time"},
          "actor_principal_id": {"type": "string", "format": "uuid"},
          "checks": {"type": "array", "items": {"$ref": "#/components/schemas/BundleCheck"}},
          "command_id": {"type": "string", "format": "uuid"}
        }
      },
      "CompanyBundleExportResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["active_version", "bundle", "bundle_digest", "metadata"],
