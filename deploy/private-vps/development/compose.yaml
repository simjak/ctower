name: ctower-private-vps-development

services:
  postgres:
    image: example.invalid/library/postgres@sha256:2222222222222222222222222222222222222222222222222222222222222222
    user: "999:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctower
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      POSTGRES_PASSWORD_FILE: /run/ctower/refs/postgres-admin-password
      POSTGRES_USER: ctower_role_admin
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ctower_role_admin", "-d", "ctower"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /run/postgresql:rw,noexec,nosuid,nodev,mode=0750
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: /run/ctower/refs/postgres-admin-password
        target: /run/ctower/refs/postgres-admin-password
        read_only: true
        bind:
          create_host_path: false
    networks: [record]

  role-admin:
    image: example.invalid/ctower/control@sha256:1111111111111111111111111111111111111111111111111111111111111111
    user: "0:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    profiles: ["admin"]
    command: ["python", "-m", "ctower_api._deployment_admin", "provision-roles"]
    environment:
      CTOWER_BOOTSTRAP_OUTPUT: /run/ctower/bootstrap/first-tenant.json
      CTOWER_ROLE_ADMIN_DSN_FILE: /run/ctower/refs/role-admin-dsn
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
      - /run/ctower:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: /run/ctower/refs/role-admin-dsn
        target: /run/ctower/refs/role-admin-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/bootstrap
        target: /run/ctower/bootstrap
        read_only: false
        bind:
          create_host_path: false
    networks: [record]

  migrator:
    image: example.invalid/ctower/control@sha256:1111111111111111111111111111111111111111111111111111111111111111
    user: "10001:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    profiles: ["admin"]
    command: ["python", "-m", "ctower_api._deployment_admin", "migrate"]
    environment:
      CTOWER_MIGRATION_DSN_FILE: /run/ctower/refs/migration-dsn
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
      - /run/ctower:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: /run/ctower/refs/migration-dsn
        target: /run/ctower/refs/migration-dsn
        read_only: true
        bind:
          create_host_path: false
    networks: [record]

  api:
    image: example.invalid/ctower/control@sha256:1111111111111111111111111111111111111111111111111111111111111111
    user: "10001:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["python", "-m", "ctower_api._deployment_server"]
    environment:
      CTOWER_API_DSN_FILE: /run/ctower/refs/api-dsn
      CTOWER_OBJECT_KEY_FILE: /run/ctower/refs/api-object-key
      CTOWER_OBJECT_ROOT: /var/lib/ctower/objects
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
      - /run/ctower:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: /run/ctower/refs/api-dsn
        target: /run/ctower/refs/api-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/api-object-key
        target: /run/ctower/refs/api-object-key
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: object-data
        target: /var/lib/ctower/objects
    networks: [control, record]

  worker:
    image: example.invalid/ctower/control@sha256:1111111111111111111111111111111111111111111111111111111111111111
    user: "10002:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["ctower-control-worker"]
    environment:
      CTOWER_OBJECT_KEY_FILE: /run/ctower/refs/worker-object-key
      CTOWER_OBJECT_ROOT: /var/lib/ctower/objects
      CTOWER_PROJECTION_DSN_FILE: /run/ctower/refs/projection-dsn
      CTOWER_WORKER_DSN_FILE: /run/ctower/refs/worker-dsn
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
      - /run/ctower:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: /run/ctower/refs/worker-dsn
        target: /run/ctower/refs/worker-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/projection-dsn
        target: /run/ctower/refs/projection-dsn
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/worker-object-key
        target: /run/ctower/refs/worker-object-key
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: object-data
        target: /var/lib/ctower/objects
    networks: [control, record]

  collector:
    image: example.invalid/otel/opentelemetry-collector-contrib@sha256:4444444444444444444444444444444444444444444444444444444444444444
    user: "10003:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CTOWER_TELEMETRY_EXPORTER_FILE: /run/ctower/refs/telemetry-exporter
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: ./otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/telemetry-exporter
        target: /run/ctower/refs/telemetry-exporter
        read_only: true
        bind:
          create_host_path: false
    networks: [control]

  edge:
    image: example.invalid/library/caddy@sha256:3333333333333333333333333333333333333333333333333333333333333333
    user: "10004:10001"
    read_only: true
    init: true
    privileged: false
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "10.0.0.10:443:443"
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,mode=0700
      - /data:rw,noexec,nosuid,nodev,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/tls-certificate
        target: /run/ctower/refs/tls-certificate
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/ctower/refs/tls-private-key
        target: /run/ctower/refs/tls-private-key
        read_only: true
        bind:
          create_host_path: false
    networks: [control]

networks:
  control:
    internal: true
  record:
    internal: true

volumes:
  object-data: {}
  postgres-data: {}
