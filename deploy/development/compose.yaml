name: ctower-development

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ctower
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ctower"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${CTOWER_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
