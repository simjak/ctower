schema = "ctower.repository-policy/v1"

[source]
extensions = [".py", ".ts", ".tsx"]
exclude = [
  ".git/**",
  ".venv/**",
  "generated/**",
  "node_modules/**",
  "tests/repository/fixtures/**",
]
protected_roots = ["apps", "packages", "tools", "tests"]

[architecture]
forbidden_module_stems = ["common", "helpers", "manager", "utils"]
non_waivable_rules = [
  "generated.drift",
  "generated.manifest",
  "generated.notice",
  "security.secret",
]

[budgets.file]
warning = 500
failure = 600

[budgets.function]
warning = 40
failure = 60

[budgets.complexity]
warning = 8
failure = 10

[budgets.nesting]
warning = 2
failure = 3

[budgets.public_exports]
warning = 15
failure = 25

[budgets.class_methods]
warning = 10
failure = 15

[budgets.dependency_fanout]
warning = 8
failure = 12

[generated]
manifest = "generated/.generated-manifest.json"
output_root = "generated"
input_roots = ["contracts", "tools"]
input_files = ["SPEC.md"]

[profiles]
staged = ["source", "ownership"]
fast = ["source", "ownership"]
full = ["source", "ownership", "generated"]

[[ownership]]
name = "repository-policy"
paths = ["tools/__init__.py", "tools/checks/**"]
allowed_dependencies = []

[[ownership]]
name = "repository-tests"
paths = ["tests/repository/**"]
allowed_dependencies = ["repository-policy"]

[[ownership]]
name = "compatibility-tools"
paths = ["tools/compatibility/**"]
allowed_dependencies = []

[[ownership]]
name = "compatibility-tests"
paths = ["tests/compatibility/**"]
allowed_dependencies = ["compatibility-tools"]

[[ownership]]
name = "contract-tests"
paths = ["tests/contracts/**"]
allowed_dependencies = ["repository-policy"]

[[ownership]]
name = "web"
paths = ["apps/ctower-web/**"]
allowed_dependencies = []
