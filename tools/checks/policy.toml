schema = "ctower.repository-policy/v1"

[source]
extensions = [".py", ".ts", ".tsx"]
module_roots = [
  "apps/ctower-api/src",
  "apps/ctowerctl/src",
  "generated/python",
  "packages/ctower-kernel/src",
  "tests/acceptance/increment-1",
  "tests/compatibility",
]
exclude = [
  ".git/**",
  ".venv/**",
  "generated/**",
  "node_modules/**",
  "tests/repository/fixtures/**",
]
protected_roots = ["apps", "packages", "tools", "tests"]

[architecture]
forbidden_module_stems = ["common", "helpers", "manager", "utils"]
non_waivable_rules = [
  "architecture.dependency",
  "architecture.private-import",
  "architecture.unresolved-import",
  "generated.drift",
  "generated.manifest",
  "generated.notice",
  "security.secret",
]

[budgets.file]
warning = 500
failure = 600

[budgets.function]
warning = 40
failure = 60

[budgets.complexity]
warning = 8
failure = 10

[budgets.nesting]
warning = 2
failure = 3

[budgets.public_exports]
warning = 15
failure = 25

[budgets.class_methods]
warning = 10
failure = 15

[budgets.dependency_fanout]
warning = 8
failure = 12

[generated]
manifest = "generated/.generated-manifest.json"
output_root = "generated"
input_roots = ["contracts", "tools"]
input_files = ["SPEC.md"]

[profiles]
staged = ["source", "ownership"]
fast = ["source", "ownership"]
full = ["source", "ownership", "generated"]

[[ownership]]
name = "repository-policy"
paths = ["tools/__init__.py", "tools/checks/**"]
allowed_dependencies = []

[[ownership]]
name = "repository-tests"
paths = ["tests/repository/**"]
allowed_dependencies = ["repository-policy"]

[[ownership]]
name = "compatibility-tools"
paths = ["tools/compatibility/**"]
allowed_dependencies = []

[[ownership]]
name = "compatibility-tests"
paths = ["tests/compatibility/**"]
allowed_dependencies = ["compatibility-tools"]

[[ownership]]
name = "http-client-codegen"
paths = ["tools/codegen/**"]
allowed_dependencies = ["repository-policy"]

[[ownership]]
name = "runtime-manifest-tools"
paths = ["tools/runtime_manifest/**"]
allowed_dependencies = []

[[ownership]]
name = "development-runtime-tools"
paths = ["tools/development_runtime/**"]
allowed_dependencies = [
  "control-api",
  "control-cli",
  "kernel-record",
  "runtime-manifest-tools",
]

[[ownership]]
name = "contract-tests"
paths = ["tests/contracts/**"]
allowed_dependencies = ["http-client-codegen", "repository-policy"]

[[ownership]]
name = "kernel-record"
paths = ["packages/ctower-kernel/src/ctower_kernel/__init__.py", "packages/ctower-kernel/src/ctower_kernel/record/**"]
allowed_dependencies = ["kernel-telemetry"]

[[ownership]]
name = "kernel-objects"
paths = ["packages/ctower-kernel/src/ctower_kernel/objects/**"]
allowed_dependencies = []

[[ownership]]
name = "kernel-catalog"
paths = ["packages/ctower-kernel/src/ctower_kernel/catalog/**"]
allowed_dependencies = ["kernel-objects", "kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-telemetry"
paths = ["packages/ctower-kernel/src/ctower_kernel/telemetry/**"]
allowed_dependencies = []

[[ownership]]
name = "kernel-access"
paths = ["packages/ctower-kernel/src/ctower_kernel/access/**"]
allowed_dependencies = ["kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-migration"
paths = [
  "packages/ctower-kernel/src/ctower_kernel/migration/**",
  "tools/migration/__init__.py",
  "tools/migration/ctower_project/**",
]
allowed_dependencies = ["kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-work"
paths = ["packages/ctower-kernel/src/ctower_kernel/work/**"]
allowed_dependencies = ["kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-proof"
paths = ["packages/ctower-kernel/src/ctower_kernel/proof/**"]
allowed_dependencies = ["kernel-objects", "kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-workflow"
paths = ["packages/ctower-kernel/src/ctower_kernel/workflow/**"]
allowed_dependencies = ["kernel-record", "kernel-telemetry"]

[[ownership]]
name = "kernel-projections"
paths = ["packages/ctower-kernel/src/ctower_kernel/projections/**"]
allowed_dependencies = ["kernel-record"]

[[ownership]]
name = "kernel-attention"
paths = ["packages/ctower-kernel/src/ctower_kernel/attention/**"]
allowed_dependencies = ["kernel-record"]

[[ownership]]
name = "kernel-runtime"
paths = ["packages/ctower-kernel/src/ctower_kernel/runtime/**"]
allowed_dependencies = ["kernel-record"]

[[ownership]]
name = "control-api"
paths = ["apps/ctower-api/src/**"]
allowed_dependencies = ["kernel-access", "kernel-attention", "kernel-catalog", "kernel-objects", "kernel-projections", "kernel-proof", "kernel-record", "kernel-runtime", "kernel-telemetry", "kernel-work", "kernel-workflow"]

[[ownership]]
name = "development-runtime-tests"
paths = ["tests/development_runtime/**"]
allowed_dependencies = ["control-api", "development-runtime-tools", "kernel-record"]

[[ownership]]
name = "control-cli"
paths = [
  "apps/ctowerctl/src/**",
  "tests/integration/**",
  "tests/modules/ctowerctl/**",
  "tests/artifact/**",
]
allowed_dependencies = ["runtime-manifest-tools"]

[[ownership]]
name = "increment-1-acceptance-tests"
paths = ["tests/acceptance/increment-1/**"]
allowed_dependencies = ["control-api", "control-cli", "kernel-access", "kernel-attention", "kernel-catalog", "kernel-migration", "kernel-objects", "kernel-projections", "kernel-proof", "kernel-record", "kernel-runtime", "kernel-telemetry", "kernel-work", "kernel-workflow"]

[[ownership]]
name = "kernel-module-tests"
paths = [
  "tests/modules/__init__.py",
  "tests/modules/access/**",
  "tests/modules/attention/**",
  "tests/modules/catalog/**",
  "tests/modules/migration/**",
  "tests/modules/objects/**",
  "tests/modules/projections/**",
  "tests/modules/proof/**",
  "tests/modules/record/**",
  "tests/modules/runtime/**",
  "tests/modules/work/**",
  "tests/modules/workflow/**",
]
allowed_dependencies = ["control-api", "kernel-access", "kernel-attention", "kernel-catalog", "kernel-migration", "kernel-objects", "kernel-projections", "kernel-proof", "kernel-record", "kernel-runtime", "kernel-telemetry", "kernel-work", "kernel-workflow"]

[[ownership]]
name = "web"
paths = ["apps/ctower-web/**"]
allowed_dependencies = []
