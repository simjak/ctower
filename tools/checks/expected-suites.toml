schema = "ctower.expected-suites/v1"
manifest_version = 1
active_phase = "CT-L0-007"
phase_order = ["CT-L0-007", "CT-I1-008", "CT-I2-010"]

[[suite]]
id = "repository-policy"
owner = "CT-L0-007"
phase = "CT-L0-007"
status = "required"
path = "tests/repository"
patterns = ["test_*.py"]
command = ["python3", "-m", "unittest", "discover", "-s", "tests/repository", "-v"]
timeout_seconds = 120

[[suite]]
id = "l0-authored-contracts"
owner = "CT-L0-007"
phase = "CT-L0-007"
status = "required"
path = "tests/contracts/l0"
patterns = ["test_*.py"]
command = ["python3", "-m", "unittest", "discover", "-s", "tests/contracts/l0", "-v"]
timeout_seconds = 120

[[suite]]
id = "increment-1-acceptance"
owner = "CT-I1-008"
phase = "CT-I1-008"
status = "deferred"
path = "tests/acceptance/increment-1"
patterns = ["test_*.py"]
command = ["python3", "-m", "pytest", "tests/acceptance/increment-1", "-q"]
timeout_seconds = 900

[[suite]]
id = "increment-2-golden-path"
owner = "CT-I2-010"
phase = "CT-I2-010"
status = "deferred"
path = "tests/acceptance/increment-2"
patterns = ["test_*.py"]
command = ["python3", "-m", "pytest", "tests/acceptance/increment-2", "-q"]
