  "note": "Draft example only. Each ReviewPlan is identified solely by its review_plans map name inside this pinned gate-policy revision and addressed as <gate-policy-key>@<revision>#review-plans.<name>; it has no independent key, revision, status, or VersionedComponent identity. The base code-review perspective covers correctness and maintainability. Automatic spin is bounded by nonpassing rounds, per-lineage repairs, and candidate generations; total executions remain immutable server-owned audit state. The platform schema contains no engineering personas or cross-plan ceiling. | Status raised draft->staged 2026-08-16 so the workflow can register: ctowerctl indexes installed policy components only when status is staged or published, so a draft policy makes its workflow unresolvable with \"installed Workflow policy is unavailable\"."
