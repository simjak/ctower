site_name: ctower
site_description: Durable task and workflow control for humans and replaceable AI agents
site_url: https://simjak.github.io/ctower/
repo_name: simjak/ctower
repo_url: https://github.com/simjak/ctower
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - concepts/index.md
      - The whole picture in one map: concepts/map.md
      - Ticket and lifecycle episode: concepts/tickets.md
      - Workflow revision and execution policy: concepts/workflows.md
      - Proof, evidence, and verdicts: concepts/proof.md
      - Board lanes: concepts/board.md
      - Project Delivery projection: concepts/project-delivery.md
      - Durability and acceptance: concepts/durability.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/http-api.md
      - Generated clients and contracts: reference/clients.md
      - Authored OpenAPI document: https://github.com/simjak/ctower/blob/main/contracts/http/openapi.yaml
      - Authored contracts: https://github.com/simjak/ctower/tree/main/contracts
  - For agents:
      - Operating contract: agents/operating-contract.md
      - Refusals: agents/refusals.md
  - Guides:
      - Protected CLI and spool: guides/protected-cli.md
      - CompanyBundle: guides/company-bundle.md
      - Contribution guide: https://github.com/simjak/ctower/blob/main/CONTRIBUTING.md
  - Advanced and internals:
      - internals.md
      - Delivery state: project-status.md
      - What is deliberately unavailable: start-here/availability.md
      - Repository setup: start-here/repository-setup.md
      - Exercise the development walking slice: getting-started.md
      - Operations:
          - Current operational boundary: operations/current-boundary.md
          - Record-backed landing boundary check: operations/landing-boundary-check.md
          - Observability: operations/observability.md
          - Project-seat credential ceremony: operations/seat-credential-issuance.md
          - Backup and anchors: operations/backup-and-anchors.md
          - Key recovery: operations/key-recovery.md
          - Isolated restore: operations/isolated-restore.md
          - Rollback: operations/rollback.md
          - ctower-project cutover: operations/ctower-project-cutover.md
          - Recovery evidence: operations/recovery-evidence.md
      - Security:
          - Secret handling: security/secret-handling.md
      - Contributing:
          - Development guide: contributing/development.md
          - Coding standards: contributing/CODING_STANDARDS.md
          - Documentation policy: contributing/documentation.md
          - Releases: contributing/releases.md
      - Canonical sources:
          - System specification: https://github.com/simjak/ctower/blob/main/SPEC.md
          - Decision log: https://github.com/simjak/ctower/blob/main/DECISIONS.md
          - Architecture atlas: https://github.com/simjak/ctower/blob/main/ARCHITECTURE.md
          - Implementation roadmap: https://github.com/simjak/ctower/blob/main/IMPLEMENTATION-ROADMAP.md
