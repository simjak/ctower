site_name: ctower
site_description: Durable task and workflow control for humans and replaceable AI agents
site_url: https://simjak.github.io/ctower/
repo_name: simjak/ctower
repo_url: https://github.com/simjak/ctower
edit_uri: edit/main/docs/
exclude_docs: |
  internal/**
strict: true

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Concepts:
      - concepts/index.md
      - The whole picture in one map: concepts/map.md
      - The components, grouped: concepts/components.md
      - Requests: concepts/requests.md
      - Request-maintenance proposals: concepts/request-maintenance-proposals.md
      - Rulings and agreements: concepts/rulings.md
      - Morning digest: concepts/morning-digest.md
      - Tickets: concepts/tickets.md
      - Stages: concepts/stages.md
      - Gates: concepts/gates.md
      - Chat: concepts/chat.md
      - Console view grants: concepts/console-viewer.md
      - Routines: concepts/routines.md
      - Workflow details: concepts/workflows.md
      - Proof, evidence, and verdicts: concepts/proof.md
      - Boards and portfolio: concepts/board.md
      - Project Delivery projection: concepts/project-delivery.md
      - Durability and acceptance: concepts/durability.md
  - Quickstart: quickstart.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/http-api.md
      - Generated clients and contracts: reference/clients.md
      - Authored OpenAPI document: https://github.com/simjak/ctower/blob/main/contracts/http/openapi.yaml
      - Authored contracts: https://github.com/simjak/ctower/tree/main/contracts
  - For agents:
      - Operating contract: agents/operating-contract.md
      - Refusals: agents/refusals.md
  - Guides:
      - Protected CLI and spool: guides/protected-cli.md
      - CompanyBundle: guides/company-bundle.md
      - Operator surface: guides/operator-surface.md
  - Security:
      - Secret handling: security/secret-handling.md
  - Development:
      - Current availability: start-here/availability.md
      - Repository setup: start-here/repository-setup.md
      - One-command development tour: getting-started.md
      - Local development: local-development.md
      - Self-hosting boundary: self-hosting.md
      - Development guide: contributing/development.md
      - Coding standards: contributing/CODING_STANDARDS.md
      - Documentation policy: contributing/documentation.md
      - Releases: contributing/releases.md
      - Contribution guide: https://github.com/simjak/ctower/blob/main/CONTRIBUTING.md
